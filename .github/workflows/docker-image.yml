name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7.0.0

      - name: Build Go
        run: make build
        working-directory: go

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: build-binary

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file go/Dockerfile --tag my-image-name:$(date +%s)
